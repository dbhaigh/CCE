name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Existing commit to build (used by the draft-release workflow)
        required: false
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: Test and bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Linux native dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2 patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked npm dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web assets
        run: npm run build:web
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Bundle Windows executable and NSIS installer
        if: matrix.os == 'windows-latest'
        run: npm run desktop:build -- --bundles nsis
      - name: Bundle macOS app and DMG
        if: matrix.os == 'macos-latest'
        run: npm run desktop:build -- --bundles app,dmg
      - name: Archive macOS app without losing bundle metadata
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(src-tauri/target/release/bundle/macos/*.app)
          [[ ${#apps[@]} -eq 1 ]]
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "${apps[0]}.zip"
      - name: Bundle Linux deb and AppImage
        if: matrix.os == 'ubuntu-22.04'
        run: npm run desktop:build -- --bundles deb,appimage
      - name: Upload Windows bundles
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-latest
          if-no-files-found: error
          path: |
            src-tauri/target/release/code-compiler-empire.exe
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload macOS bundles
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-latest
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/macos/*.app.zip
            src-tauri/target/release/bundle/dmg/*.dmg
      - name: Upload macOS app directory
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-directory
          if-no-files-found: error
          include-hidden-files: true
          path: |
            src-tauri/target/release/bundle/macos/
            !src-tauri/target/release/bundle/macos/*.app.zip
      - name: Upload Linux bundles
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ubuntu-22.04
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
